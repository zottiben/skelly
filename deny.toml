# cargo-deny: the supply-chain gate (advisories, licenses, bans, sources).
# Run with `cargo deny check`. See engineering-playbook / rust-quality-gates.

[advisories]
version = 2
yanked = "deny"
# Ignored only when transitive, unfixable now, and low-relevance to our threat
# model. Each entry states why and when to revisit. Re-audit at every dep bump.
ignore = [
    # quick-xml XML DoS (quadratic parse / unbounded namespace alloc). Reached ONLY
    # on Linux via winit -> sctk-adwaita (Wayland client-side window decorations,
    # parsing the desktop theme) - never from input Skelly handles, and not compiled
    # on macOS. No patched release within sctk-adwaita's range. Revisit when
    # winit/sctk-adwaita bump quick-xml.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # ttf-parser unmaintained (not a vulnerability). Pulled transitively by
    # cosmic-text/fontdb for font parsing; no drop-in swap until glyphon/cosmic-text
    # migrate to skrifa. Revisit at the next cosmic-text bump.
    "RUSTSEC-2026-0192",
]

[licenses]
version = 2
# The allow-list is forward-looking; do not warn about entries no current dep uses.
unused-allowed-license = "allow"
# Skelly ships as MIT OR Apache-2.0; only permissive, compatible licenses allowed in.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path deps within the workspace have no version; that is not a real
# wildcard-supply-chain risk, so permit it while still denying external wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
