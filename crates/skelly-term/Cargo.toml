[package]
name = "skelly-term"
description = "Terminal core: PTY, shell I/O, ANSI/VT parsing, grid, scrollback. No UI or GPU deps."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
alacritty_terminal = "0.25.0"
bitflags = { workspace = true }
portable-pty = "0.9.0"

[dev-dependencies]
# Property-based robustness testing of the VT parser: feed arbitrary bytes and
# assert our grid readers never panic (playbook §4 parsers / §7 threat model).
proptest = "1"
