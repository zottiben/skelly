name: Release

# Cut a release by pushing a version tag that matches Cargo.toml:
#   git tag v0.1.0 && git push origin v0.1.0
# Builds a universal macOS Skelly.app + Linux binaries, publishes a GitHub Release,
# and uploads checksums.txt. Asset names match what install.sh expects.
#
# macOS is ad-hoc signed by default (no Apple account needed - curl installs run
# without a Gatekeeper prompt since curl downloads aren't quarantined). To ship a
# Developer ID signed + notarized build instead, add these repo secrets and the
# workflow upgrades automatically (no edits needed):
#   MACOS_CERT_P12_BASE64   base64 of your "Developer ID Application" .p12
#   MACOS_CERT_PASSWORD     the .p12 export password
#   MACOS_SIGN_IDENTITY     e.g. "Developer ID Application: NAME (TEAMID)"
#   APPLE_API_KEY_BASE64    base64 of your App Store Connect API key (.p8)  [notarize]
#   APPLE_API_KEY_ID        the API key's Key ID                            [notarize]
#   APPLE_API_ISSUER        the API key's Issuer ID                         [notarize]
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(grep '^version' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "tag=$VERSION cargo=$CARGO_VERSION"
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $CARGO_VERSION" >&2
            exit 1
          fi

  macos:
    name: macOS universal .app
    needs: verify
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Build universal binary
        run: |
          set -eux
          cargo build --release -p skelly --target aarch64-apple-darwin
          cargo build --release -p skelly --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/skelly-universal \
            target/aarch64-apple-darwin/release/skelly \
            target/x86_64-apple-darwin/release/skelly

      - name: Sign, bundle and package
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          IDENTITY="-"

          # Developer ID path (only when the cert secrets are present).
          if [ -n "${MACOS_CERT_P12_BASE64:-}" ] && [ -n "${MACOS_SIGN_IDENTITY:-}" ]; then
            KEYCHAIN="$RUNNER_TEMP/skelly.keychain-db"
            KPASS="$(uuidgen)"
            security create-keychain -p "$KPASS" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KPASS" "$KEYCHAIN"
            echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -k "$KPASS" "$KEYCHAIN" >/dev/null
            security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
            IDENTITY="$MACOS_SIGN_IDENTITY"
          fi

          sh packaging/macos/bundle.sh dist/skelly-universal "$VERSION" dist "$IDENTITY"

          # Notarize + staple when an App Store Connect API key is also provided.
          if [ "$IDENTITY" != "-" ] && [ -n "${APPLE_API_KEY_BASE64:-}" ]; then
            echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            ditto -c -k --keepParent dist/Skelly.app "$RUNNER_TEMP/notarize.zip"
            xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
              --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" --wait
            xcrun stapler staple dist/Skelly.app
          fi

          tar czf "dist/Skelly-v${VERSION}-macos-universal.tar.gz" -C dist Skelly.app
          hdiutil create -volname "Skelly" -srcfolder dist/Skelly.app -ov -format UDZO \
            "dist/Skelly-v${VERSION}-macos-universal.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/Skelly-v*-macos-universal.tar.gz
            dist/Skelly-v*-macos-universal.dmg
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, arch: x86_64, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, arch: aarch64, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build and archive
        run: |
          set -eux
          VERSION="${GITHUB_REF_NAME#v}"
          cargo build --release -p skelly --target ${{ matrix.target }}
          mkdir -p stage
          cp "target/${{ matrix.target }}/release/skelly" stage/skelly
          cp packaging/linux/skelly.png stage/skelly.png
          tar czf "skelly-v${VERSION}-linux-${{ matrix.arch }}.tar.gz" -C stage skelly skelly.png

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: skelly-v*-linux-*.tar.gz
          if-no-files-found: error

  release:
    name: publish release
    needs: [macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum Skelly-v* skelly-v* > checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            Skelly-v* skelly-v* checksums.txt
