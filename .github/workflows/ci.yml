name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Dependencies are compiled with --cap-lints=allow by cargo, so this denies
  # warnings only in our own crates and their test/example targets.
  RUSTFLAGS: "-D warnings"

jobs:
  gate:
    name: gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Keep this version in sync with rust-toolchain.toml when it is bumped.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      # The local Pi bridge has dependency-free Node tests and a Rust/Node wire test.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Linux audio build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config espeak-ng
      - uses: Swatinem/rust-cache@v2
      - name: format
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --workspace --all-features
      - name: Pi companion extension
        run: npm --prefix integrations/pi test
      - name: Native speech synthesis (file only, no speaker)
        shell: bash
        run: |
          set -eu
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          printf '%s' 'Skelly local speech smoke test.' > "$TMP/input.txt"
          if [ "$RUNNER_OS" = macOS ]; then
            /usr/bin/say -f "$TMP/input.txt" -o "$TMP/output.aiff"
            test -s "$TMP/output.aiff"
          else
            espeak-ng -f "$TMP/input.txt" -w "$TMP/output.wav"
            test -s "$TMP/output.wav"
          fi
      - name: doc
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: "-D warnings"

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
