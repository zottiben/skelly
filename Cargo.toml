[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.11"
edition = "2021"
# MSRV tracks the pinned toolchain (rust-toolchain.toml): Skelly is an application
# with a self-contained GUI dependency stack (wgpu / cosmic-text / alacritty_terminal)
# whose own MSRVs already require recent stable, so there is no lower floor to support.
# Bump this together with rust-toolchain.toml.
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zottiben/skelly"
authors = ["the Skelly authors"]

# Centralized dependency versions - member crates opt in with `foo.workspace = true`
# so the graph is single-sourced. Foundation crates (wgpu / winit / portable-pty /
# alacritty_terminal / cosmic-text) are intentionally absent until their ADRs are
# ratified and the M1 walking skeleton lands them.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
bitflags = "2"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# Micro-benchmarking (playbook §4 hot-path budgets). Lean: no plotters/gnuplot HTML
# reports or rayon, just the CLI stats harness, to keep the bench dep graph small.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
# `unsafe` is a reviewed exception, not a default. Crates that genuinely need FFI /
# GPU unsafe (skelly-render, skelly-term later) will define their own lint table and
# justify every block with a `// SAFETY:` comment.
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allowed back with a reason - these fight idiomatic, well-organized code.
module_name_repetitions = { level = "allow", priority = 1 }

# A slightly optimized dev profile keeps the terminal responsive when run unoptimized.
# opt-level 1 on the workspace crates (the render/input hot paths) plus opt-level 2 on
# dependencies (cosmic-text shaping, wgpu) means a plain `cargo run` is smooth without
# needing `--release`, while dev compiles stay fast enough for iteration.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
