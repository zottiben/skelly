# cargo-deny: the supply-chain gate (advisories, licenses, bans, sources).
# Run with `cargo deny check`. See engineering-playbook / rust-quality-gates.

[advisories]
version = 2
yanked = "deny"
# ignore = ["RUSTSEC-YYYY-NNNN"]  # only ever with a comment + a tracking issue.

[licenses]
version = 2
# The allow-list is forward-looking; do not warn about entries no current dep uses.
unused-allowed-license = "allow"
# Skelly ships as MIT OR Apache-2.0; only permissive, compatible licenses allowed in.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path deps within the workspace have no version; that is not a real
# wildcard-supply-chain risk, so permit it while still denying external wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
