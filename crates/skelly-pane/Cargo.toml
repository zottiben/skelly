[package]
name = "skelly-pane"
description = "A tab's terminal panes tiled as a clockwise Fibonacci spiral (open / close / focus / zoom, uncapped). Pure logic, no UI/GPU/PTY deps."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Serialize the focus/zoom snapshot for launch-time session restore (layout only).
serde.workspace = true

[dev-dependencies]
# Property-based testing of the tiling invariants: random op sequences must keep the
# panes well-formed and the layout a gap-free, overlap-free tiling (playbook §4).
proptest = "1"
