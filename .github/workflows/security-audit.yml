name: security-audit

# The PR/main gate (ci.yml) runs the full `cargo deny check`. This job re-checks
# advisories on a daily schedule and whenever the dependency graph changes, to catch
# advisories filed *after* the last commit. Using cargo-deny keeps one source of
# truth for ignores (deny.toml) and needs no check-run permissions.
on:
  schedule:
    - cron: "0 6 * * *"
  push:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
      - ".github/workflows/security-audit.yml"

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
