name: security-audit

# cargo-deny gates advisories at PR time; this catches advisories filed *after*
# the last push, on a daily schedule and whenever the dependency graph changes.
on:
  schedule:
    - cron: "0 6 * * *"
  push:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/security-audit.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
