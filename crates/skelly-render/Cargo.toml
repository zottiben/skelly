[package]
name = "skelly-render"
description = "GPU cell-grid renderer, font shaping/fallback, and semantic theme-token resolution."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dev-dependencies]
# Headless capture example: encode the offscreen render to a PNG for visual/golden
# verification without a window.
png = "0.17"

[dependencies]
bytemuck = { version = "1.25.1", features = ["derive"] }
glyphon = "0.12.0"
pollster = "1.0.1"
raw-window-handle = "0.6"
skelly-config = { version = "0.1.0", path = "../skelly-config" }
thiserror.workspace = true
wgpu = "30"
